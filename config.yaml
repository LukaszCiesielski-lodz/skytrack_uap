# Konfiguracja skyhunt.
# Każda sekcja wpływa na hash etapów, które od niej zależą (manifest.json):
# zmiana wartości powoduje przeliczenie tych etapów i wszystkich zależnych.

site:
  name: "Łódź (SE)"
  lat_deg: 51.718042
  lon_deg: 19.582748
  elevation_m: 210

camera:
  body: "Fujifilm X-E3"
  lens: "Fujinon XF 50mm F1.0 R WR"
  focal_mm: 50.0
  f_number: 1.0
  # Ostrość ustawiona ręcznie „tuż przed nieskończonością”, więc gwiazdy mogą być lekko
  # nieostre. Odległość ostrzenia nieznana; wyznaczymy ją z PSF gwiazd (M4).
  focus_distance_m: null
  # Czas naświetlania klatki; null = 1/fps (X-E3 w wideo: 1/24 s przy 23,98 kl/s, 1/30 s przy 29,97).
  # Weryfikacja z długości smug satelitów (M3).
  shutter_s: null
  sensor_width_mm: 23.5
  nominal_hfov_deg: 26.4   # tylko wartość startowa; rzeczywiste pole z plate solve
  exposure_offset_s: null  # czas środka ekspozycji względem znacznika klatki; null = shutter_s/2
  rolling_shutter_s: 0.0   # czas odczytu od górnego do dolnego wiersza (nieznany; 0 = pomijamy)

time:
  camera_tz: "Europe/Warsaw"
  # O ile zegar aparatu spieszy się względem czasu lokalnego [s]. Zegar poprawiony
  # 28.09.2026; starsze nagrania mają własną wartość w sekcji `files`.
  camera_clock_ahead_s: 0
  # Źródło czasu startu: maker_datetime (data EXIF Fuji w udta; potwierdzone na 2 plikach,
  # że to start – mvhd jest ~24 s po końcu nagrania), mvhd_creation, mvhd_creation_minus_duration.
  start_source: maker_datetime
  prior_sigma_s: 60        # 1σ niepewności a priori; właściwy czas z satelitów (M2)
  sync_search_s: 7200      # zakres szukania poprawki zegara przy synchronizacji po satelitach

detect:
  # Tło: mediana per piksel z okna ±bg_half_window_frames (co bg_stride), liczona raz na blok
  # bg_block_frames klatek. Gwiazdy dryfują ~0.43 px/s, więc okno ±1 s daje ≤0.4 px rozmycia.
  bg_block_frames: 24
  bg_half_window_frames: 24
  bg_stride: 2
  bg_tile_rows: 540          # mediana liczona w pasach wierszy (pamięć GPU)
  sigma_floor_dn: 0.5        # H.264 daje MAD = 0 na płaskich obszarach
  subtract_frame_offset: true  # odejmij medianę (klatka − tło): pulsowanie I-klatek, zmierzch
  offset_subsample: 4
  psf_sigma_px: 1.5          # matched filter (Gauss)
  renormalize_filtered: true # po filtrze: podziel przez odporne σ mapy (szum H.264 skorelowany)
  snr_seed: 5.0              # próg wykrycia (maksimum komponentu)
  snr_grow: 3.0              # próg rozrostu komponentu (histereza)
  min_pixels: 3
  max_components_per_frame: 2000  # więcej = klatka oflagowana (chmury, błysk) i pominięta
  labeler: auto              # auto | cupy | scipy
  frames_per_step: 8         # klatek przetwarzanych naraz na GPU
  epoch_every_s: 60          # co ile zapisać stack epoki (mediana ±1 s) do plate solve
  star_thr_sigma: 8.0        # próg gwiazd przy pomiarze szerokości PSF na stacku epoki

tracks:
  # Filtr statyczny: komórka static_cell_px (z sąsiadami 3×3) w oknie static_window_s jest
  # „statyczna” (gwiazda, hot piksel), gdy ma ≥ static_min_count trafień w ≥ static_min_seconds
  # różnych sekundach. Przelatujący obiekt siedzi w komórce 1–2 s, więc zostaje.
  static_cell_px: 4
  static_window_s: 10
  static_min_count: 6
  static_min_seconds: 4
  gate_px: 8                 # bramka łączenia: gate_px + gate_speed_frac·|v|·Δklatek
  gate_speed_frac: 0.1
  init_gate_px: 48           # bramka drugiego punktu toru (nieznana prędkość)
  max_gap_frames: 3
  min_len: 6
  min_disp_px: 20
  # Łańcuchy kropek szumu: tor krótszy niż weak_min_len punktów I z medianą SNR maksimum
  # poniżej weak_snr jest odrzucany (po sklejeniu fragmentów). Krótkie jasne tory zostają.
  weak_min_len: 10
  weak_snr: 7.0
  # …chyba że detekcje są kreskami wzdłuż ruchu (słaby meteor): σ_wzdłuż ≥ frac·v i ≥ ratio·σ_poprzek.
  # Kreska w ekspozycji 1/30 s przy 29,97 kl/s: σ ≈ v/√12 ≈ 0,29·v (próg niżej, bo próg detekcji ją skraca).
  streak_min_along_frac: 0.15
  streak_min_ratio: 1.5
  merge_gate_px: 15          # sklejanie fragmentów toru
  merge_gap_frames: 60       # ~2 s: jasne obiekty bywają pocięte przerwami 1–1,6 s
  merge_angle_deg: 5
  edge_margin_px: 20         # tor zaczyna/kończy się „na krawędzi”, jeśli bliżej brzegu
  fft_min_frames: 24
  fft_detrend_frames: 9
  fft_min_hz: 0.5

classify:
  # Podpowiedź klasy dla torów bez dopasowania do katalogu (port baseline/skytracks.py).
  meteor_min_deg_s: 1.8
  meteor_max_dur_s: 2.0
  straight_max_curv_px: 4.0
  near_cross_ratio: 1.8      # szerokość poprzeczna ÷ gwiazda: nieostry, więc bliski
  bright_peak_snr: 50        # jaśniejszy (mediana SNR maksimum) = prześwietlony: szerokość nie znaczy „bliski”
  periodic_min_power: 6
  aircraft_f_hz: [0.4, 2.0]
  # Ptak: istotna modulacja jasności (moc > periodic_min_power; u satelitów i szumu moc ≈ 3)
  # w paśmie machania skrzydłami i prędkość typowa dla ptaka kilkaset m nad kamerą.
  bird_f_hz: [2.0, 15.0]
  bird_deg_s: [0.5, 20.0]
  satellite_deg_s: [0.05, 1.8]
  # Przelot ptaków (nocna migracja): ≥ flock_min_tracks niezidentyfikowanych torów o podobnej
  # prędkości i kierunku, na różnych liniach (nie fragmenty jednego toru). Szybszych niż LEO,
  # więc pociąg Starlinków się nie łapie. „meteor?” zostaje meteorem — dostaje tylko drugą hipotezę.
  # DSCF4651: 7 torów 1,8–2,05°/s, wszystkie ze wschodu na zachód, ciepłe (łuna miasta).
  flock_min_tracks: 3
  flock_deg_s: [1.5, 20.0]
  flock_speed_tol: 0.25      # |ω_j/ω_i − 1|
  flock_dir_tol_deg: 20
  flock_min_sep_px: 40       # środek innego toru co najmniej tyle od linii toru (inny obiekt)

darkstats:
  hot_min_frac: 0.2          # piksel „gorący”, jeśli wykryty w ≥ tej części klatek

astrometry:
  # Gwiazda w kadrze (podpowiedź dla plate solve). Deneb: Łabędź jest w zenicie o 20–21 czasu
  # lokalnego jesienią. Inny kierunek → nadpisanie per plik albo null; przy porażce z podpowiedzią
  # solve-field i tak próbuje jeszcze bez niej.
  hint_star: Deneb
  hint_radius_deg: 20        # gwiazda nie musi być w środku kadru
  solve_field: solve-field
  index_dir: /content/drive/MyDrive/skyhunt/cache/astrometry
  index_url: https://data.astrometry.net/4100
  index_series: [4110, 4111, 4112, 4113, 4114, 4115, 4116, 4117, 4118, 4119]
  local_index_dir: /tmp/skyhunt-astrometry-index   # kopia indeksów na dysku lokalnym (mmap)
  work_dir: /tmp/skyhunt-astrometry                # pliki robocze solve-field
  scale_low_deg: 12          # szerokość kadru [°] – szeroki zakres, bo crop 4K nieznany
  scale_high_deg: 32
  tweak_order: 3             # SIP: dystorsja f/1.0
  downsample: 2
  retry_downsample: 4
  cpulimit_s: 180
  max_objs: 1000
  max_epoch_rms_px: 1.0      # zgodność epok w stałym układzie Alt/Az (inaczej: kamera się ruszyła)

satellites:
  # Elementy orbit w CSV/OMM (format TLE nie obejmuje numerów NORAD ≥ 100000).
  cache_dir: /content/drive/MyDrive/skyhunt/cache/gp
  celestrak_url: https://celestrak.org/NORAD/elements/gp.php
  celestrak_groups: [active, visual, stations, analyst, cosmos-2251-debris, iridium-33-debris,
                     fengyun-1c-debris]
  auto_fetch: true           # pobierz, jeśli brak snapshotu po nagraniu, a nagranie jest świeże
  max_elements_age_days: 3
  min_refetch_h: 2           # CelesTrak: 1 pobranie na aktualizację; 403 = blokada
  spacetrack: auto           # auto (gdy są $SPACETRACK_USER/$SPACETRACK_PASSWORD) | off
  # Satelity nieobecne w publicznych katalogach (głównie wojskowe), śledzone przez amatorską
  # sieć obserwatorów (Mike McCants). Elementy bywają sprzed wielu dni → tylko kandydaci „low”.
  classfd: auto              # auto | off
  classfd_url: https://mmccants.org/tles/classfd.zip
  history_days_before: 3
  history_days_after: 1
  ephemeris_dir: /content/drive/MyDrive/skyhunt/cache/skyfield   # de421.bsp (oświetlenie)

identify:
  window_sigma: 5            # okno synchronizacji: ± window_sigma · time.prior_sigma_s
  screen_step_s: 2           # krok przesiewu katalogu (≤ ~6° ruchu LEO)
  fov_margin_deg: 5
  min_alt_deg: 5
  # Kandydaci do synchronizacji: tory proste… (łuk LEO nie jest idealnym kołem wielkim:
  # strzałka ugięcia ~0.4 km na 20 s lotu, czyli ~2′ z odległości 700 km; RMS po dopasowaniu ~⅓ tego)
  cand_max_curv_arcsec: 150
  cand_min_deg_s: 0.2        # …o prędkości typowej dla LEO…
  cand_max_deg_s: 3.0
  cand_min_dur_s: 1.0        # …i trwające ≥ 1 s
  pre_tol_deg: 0.3           # wstępne dopasowanie tor–satelita
  speed_tol: 0.1
  dir_tol_deg: 3
  cluster_s: 1.0             # zgodność δ między torami
  min_tracks: 2              # ile niezależnych torów musi potwierdzić poprawkę czasu
  # Δ zegara: median = mediana δ zgodnych satelitów (każdy raz, bez classfd) | first = z pierwszego
  # zidentyfikowanego | best. Raport i tak pokazuje pierwszego jako odniesienie. „first” przenosił
  # błąd elementów jednego Starlinka na cały czas (DSCF4647/4648: niezgodność ≥ 0,3 s).
  reference: median
  median_sigma_floor_s: 0.02
  refine_half_range_s: 2
  tle_along_track_sigma_km: 1.0
  cross_tol_deg: 0.1         # identyfikacja przy ustalonym Δ
  dt_tol_s: 2.0
  classfd_dt_tol_s: 120      # szersze okno δ−Δ dla elementów classfd (stare elementy: błąd wzdłuż orbity)
  id_speed_tol: 0.05
  id_dir_tol_deg: 2
  ambiguity_ratio: 1.5
  sample_step_s: 1.0         # krok próbkowania satelity przy dopasowaniu przelotu
  site_warn_km: 0.3          # paralaksa satelitów wskazuje przesunięcie obserwatora > tyle → ostrzeżenie

report:
  identified_min_confidence: medium   # high | medium | low
  clip_pad_s: 0.5
  clip_min_s: 1.0
  clip_max_s: 10.0           # dłuższe tory: klip wokół środka toru (pamięć)
  clip_max_side_px: 1280     # większy kadr jest skalowany w ffmpeg
  crop_margin_px: 60
  clip_min_size_px: 480
  filmstrip_panels: 12
  filmstrip_min_s: 1.0
  filmstrip_crop_px: 160
  background_downsample: 2
  zoom_margin_px: 300
  star_label_mag: 2.0
  always_label: []           # gwiazda z astrometry.hint_star jest dodawana automatycznie
  densify_deg: 0.5
  grid_step_deg: 5

adsb:
  # Samoloty z historii ADS-B (adsb.lol, ODbL 1.0). Dzień archiwum to kilka GB: czytany
  # strumieniowo raz na dzień i miejsce, na Drive zostają tylko punkty w promieniu radius_km.
  enabled: auto              # auto | off
  cache_dir: /content/drive/MyDrive/skyhunt/cache/adsb
  instances: [prod-0, prod-1, staging-0]
  radius_km: 150             # samolot na 12 km wysokości widać jeszcze ~5° nad horyzontem z ~130 km
  max_gap_s: 120             # interpolacja trasy tylko między punktami bliższymi niż tyle
  match_deg: 1.5             # mediana odległości kątowej tor ↔ trasa ADS-B (błąd wysokości barometrycznej)

smallbodies:
  # Planetoidy, komety i NEO w kadrze: lista z JPL Small-Body Identification API (pozycje
  # z numerycznego całkowania orbit). Planetoida pasa głównego przesuwa się przez 5 min o ~0,1 px,
  # więc w nagraniu wygląda jak gwiazda — mierzymy ją w stosie wszystkich klatek, w oknie jadącym
  # razem z niebem i obiektem. „Wykryta” = źródło o SNR ≥ detect_snr w przewidzianym miejscu,
  # jasność zgodna z przewidywaną, bez jaśniejszej gwiazdy tła (Gaia DR3, VizieR) w aperturze.
  enabled: auto              # auto | off
  api_url: https://ssd-api.jpl.nasa.gov/sb_ident.api
  gaia_url: https://vizier.cds.unistra.fr/viz-bin/asu-tsv
  timeout_s: 180             # JPL przy polu 30° potrafi odpowiadać > 2 min
  retries: 3
  vmag_lim: 13.0             # planetoidy i komety jaśniejsze niż tyle (zasięg stosu 5 min ~11–12 mag)
  neo_vmag_lim: 16.0         # NEO także słabsze (na liście; pomiar powie „za słaba”)
  site_round_deg: 0.1        # do JPL idą współrzędne zaokrąglone (~10 km): dla NEO na 0,01 au błąd ~1″
  fov_margin_deg: 1.0
  max_targets: 15            # najjaśniejsze w kadrze (każdy to małe okno w tym samym przejściu)
  pos_step_s: 2.0            # pozycje liczone co tyle, między nimi interpolacja
  window_px: 24              # połowa boku okna stosu
  aperture_px: 3
  annulus_px: [6, 10]
  search_px: 2.5             # centroid w tym promieniu od przewidywanej pozycji (odchyłka O−C)
  detect_snr: 5
  mag_tol: 1.0               # |V zmierzone − V przewidziane| dla „wykryta”
  blend_dmag: 1.5            # gwiazda Gaia jaśniejsza niż V + tyle w aperturze → „zlewa się z gwiazdą”
  zp_mag_range: [4.0, 6.0]   # gwiazdy katalogowe do punktu zerowego (niezasycone w stosie)
  zp_max_stars: 40
  zp_sat_linear: 0.95        # szczyt w stosie (światło liniowe 0…1) ≥ tyle → gwiazda zasycona, pomijana
  y_full_range: false        # Y w zakresie 16–235 (wideo z aparatu); true: 0–255
  track_match_deg: 0.2       # bardzo bliski NEO jako tor: odległość od przewidywanej pozycji

iod:
  # Eksport pozycji w formacie IOD (report/iod.txt) dla amatorskiej sieci obserwatorów
  # satelitów (SeeSat-L). Numer stacji przydziela społeczność; 9999 = jeszcze nieprzydzielony.
  station: 9999
  condition: G               # warunki: E G F P B T
  unknown_object: "99999 00 000UNK"   # kolumny 1-15 dla obiektu niezidentyfikowanego
  include_identified: true   # także zidentyfikowane satelity (weryfikacja przez innych)
  centroid_px: 0.5           # niepewność środka detekcji [px], dodawana do zgodności epok
  unid_min_points: 15        # niezidentyfikowane: tylko tory dość długie…
  unid_max_curv_arcsec: 150  # …prawie proste (orbita)…
  unid_min_snr: 6.0          # …i wyraźnie nad szumem

color:
  # Kolor torów z nagrań kolorowych (czarno-białe są wykrywane i pomijane). RGB to 3 szerokie
  # pasma: wynik to temperatura barwowa na „linii gwiazd”, nadmiar zieleni i zmiana koloru —
  # wskazówka, nie widmo. Najlepiej: stały balans bieli w aparacie (światło dzienne / 5500 K).
  enabled: auto              # auto | off
  reader: auto               # auto (ffmpeg, a bez niego PyAV) | pyav
  ffmpeg_hwaccel: auto       # auto (NVDEC, jeśli działa) | on | off
  yuv_matrix: auto           # auto (z nagłówka strumienia) | bt709 | bt601
  transfer: bt709            # linearyzacja: bt709 | linear | liczba (gamma)
  calib_epochs: 3            # epoki do kalibracji na gwiazdach (per epoka: dryf balansu bieli)
  calib_frames: 15           # mediana tylu klatek wokół epoki
  calib_max_mag: 6.0
  isolation_px: 18           # bez innej gwiazdy katalogowej bliżej
  # Promień apertury: chroma 4:2:0 ma połowę rozdzielczości, a H.264 dodatkowo ją rozmywa —
  # przy 4 px (DSCF4651) kolor gwiazd był ~8× słabszy od oczekiwanego. Gwiazdy i tory tą samą aperturą.
  aperture_px: 6
  annulus_px: [9, 14]
  sat_level: 0.98            # kanał ≥ tyle (0…1) = prześwietlony, klatka bez koloru
  min_stars: 15
  min_snr: 5                 # SNR kanału G w klatce toru
  diff_min_sep_px: 16        # tło: klatki f±k, w których obiekt jest już o tyle dalej
  max_diff_frames: 60        # …ale nie dalej niż ~2 s (wolne obiekty)
  track_max_frames: 300      # najwyżej tyle klatek toru (równomiernie)
  chunk_frames: 60           # dekodowanie porcjami: mały wycinek kadru
  max_half_len_px: 60        # apertura wzdłuż kreski meteoru: aperture_px + 2·σ_wzdłuż, najwyżej tyle
  thumb_px: 64               # kolorowe miniatury w PDF
  # podpowiedzi (hipotezy):
  green_thr: 0.05            # nadmiar zieleni [dex]: Mg 517 / O 557,7 nm u meteorów
  warm_T_K: 3500             # meteor cieplejszy → Na/Fe?
  hot_T_K: 8000              # meteor gorętszy → szybki, Ca/Mg?
  city_T_K: 3000             # obiekt nie-meteor cieplejszy → łuna miasta (sód)?
  sunlit_tol_dex: 0.05       # odległość od koloru satelitów (Słońce odbite)
  # B−V satelitów oczekiwane (kontrola kalibracji). Satelity są czerwieńsze od Słońca (0,65):
  # w DSCF4647/4648 wyszło 1,03 i 0,82 przy świetnej kalibracji (RMS 0,05–0,07 dex, liniowość −0,40).
  sunlit_bv_expected: [0.5, 1.2]
  nav_spread_dex: 0.15       # rozrzut log R/G między klatkami: migające światła czerwone/zielone…
  nav_min_frames: 20         # …tylko przy istotnym miganiu jasności w paśmie samolotów i ≥ tylu klatkach
  change_chi2: 3.0           # zmiana koloru: χ² stałości > tyle…
  change_dex: 0.1            # …i zmiana na długości śladu > tyle
  # Nachylenie linii gwiazd √(b_R² + b_B²) [dex na mag B−V]; oczekiwane ~0,3. Poniżej progu kolor
  # prawie nie zależy od B−V (kodek zgniótł chromę): bez kelwinów, tylko porównanie z satelitami w dex.
  min_locus_slope: 0.1
  linearity_warn: 0.1        # |nachylenie log G vs mag + 0,4| > tyle → ostrzeżenie (krzywa tonalna)
  wb_drift_warn: 0.03        # dryf linii gwiazd między epokami [dex] → ostrzeżenie o balansie bieli

paths:
  raw_dir: /content/drive/MyDrive/skyhunt/raw
  out_dir: /content/drive/MyDrive/skyhunt/out

input:
  extensions: [".mp4", ".mov"]
  # Sesja zdjęć RAW = podfolder z co najmniej min_photos plikami o tych rozszerzeniach.
  photo_extensions: [".raf"]
  min_photos: 3

decode:
  # Kolejność prób; pierwszy działający backend jest używany w etapach obliczeniowych.
  backends: [nvcodec, torchcodec, torchaudio, pyav, ffmpeg]
  # Etapy obliczeniowe tylko z backendów dających oryginalne Y z bitstreamu
  # (torchcodec zwraca RGB, więc Y jest odtwarzane z błędem ±1 DN).
  exact_luma_required: true
  torchcodec_full_range: false
  batch_frames: 32         # klatek na paczkę (4K uint8: 8.3 MB/klatkę)
  queue_depth: 3           # paczek w kolejce producenta (backendy CPU)
  gpu_id: 0
  device: cuda             # cuda | cpu (cpu: wyniki backendów CPU zostają w RAM)

stack:
  stats_subsample: 8       # co który piksel w każdej osi do kwantyli per klatka
  frame_quantiles: [0.5, 0.999]
  preview_percentiles: [0.5, 99.9]

bench:
  frames: 480              # 20 s nagrania

# Wspólne ustawienia nagrań z zakrytym obiektywem (role: dark — z sekcji files, z komórki
# „Nagrania” w notebooku albo z nazwy pliku zawierającej „dark”).
dark_overrides:
  detect:
    # H.264 kwantuje czerń do stałej (MAD = 0), więc przy podłodze 0.5 DN każdy blok 8×8
    # o +1 DN był detekcją (79% klatek oflagowanych). Podłoga ≈ σ nieba z DSCF4641 daje
    # FAR przy tym samym progu w DN co na niebie.
    sigma_floor_dn: 1.5

photo:
  # Sesje zdjęć RAW (Fujifilm RAF, bracketing AE). Ustalenia z diagnostyki F0 (X-E3, 2.10.2026):
  # czas EXIF co 1 s (bez SubSec), każde zdjęcie ma własny czas, numer w serii w MakerNote,
  # 14 bit także przy migawce elektronicznej.
  frames_per_set: 3          # bez numeru w serii (MakerNote) grupujemy co tyle zdjęć
  inter_frame_gap_s: 0.10    # przerwa między zdjęciami serii (odczyt matrycy); zmierzymy z satelitów (F2)
  rolling_shutter_s: 0.0     # czas odczytu migawki elektronicznej; zmierzymy z satelitów (F2)
  sat_frac: 0.98             # piksel ≥ tyle × biel = nasycony (cały superpiksel 3×3 oznaczony)
  epoch_every_s: 60          # co ile sekund zdjęcie ev0 do plate solve (min. 3 epoki)
  min_epochs: 3
  stack_classes: [ev0, ev+1, ev-1]
  stack_grid: [64, 43]       # siatka mapowania zdjęcie → układ odniesienia (FixedCamera), dalej interpolacja
  stack_reject_sigma: 5.0    # piksel > średnia + tyle × σ zdjęcia (kreska, samolot) nie wchodzi do stosu
  stack_warmup: 5            # pierwsze zdjęcia klasy wchodzą bez odrzucania
  cache_dir: /content/skyhunt_cache   # lokalny dysk Colaba: luminancja per zdjęcie (float16)
  checkpoint_every: 60       # zapis stanu stosu co tyle zdjęć (wznowienie po rozłączeniu)
  workers: 4                 # wątki czytające pliki z Drive
  preview_frames: 6          # podgląd pojedynczych zdjęć w raporcie

# Ustawienia nakładane na każdą sesję zdjęć (folder) przed nadpisaniami per folder.
photo_overrides:
  astrometry:
    # superpiksele 3×3: ~2010 px szerokości, ~48″/px — bez dodatkowego zmniejszania
    downsample: 1
    retry_downsample: 2
  color:
    transfer: linear         # RAW jest liniowy

# Nadpisania per plik (klucz = nazwa pliku); nakładane na całą konfigurację. Miejsce obserwacji
# i role nowych nagrań wpisuje się w notebooku (MyDrive/skyhunt/sites.yaml), nie tutaj.
files:
  DSCF4641.MOV:
    time:
      camera_clock_ahead_s: 600   # zegar spieszył się o 10 min (przed korektą 28.09)
    astrometry:
      hint_star: Deneb
  dark_frames.MOV:
    role: dark                    # zakryty obiektyw: do FAR i mapy hot pikseli
